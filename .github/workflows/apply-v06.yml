name: Import verified v06 changes
on:
  push:
    branches: [feat/v06-matte-sea-performance]
    paths: ['.handoff-v06/**', '.github/workflows/apply-v06.yml']
permissions:
  contents: write
concurrency:
  group: v06-import
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v06-matte-sea-performance
      - name: Apply hash-checked local changes
        run: |
          python3 - <<'PY'
          import json, hashlib, subprocess
          from pathlib import Path
          def blob(b):
              return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          for batch in sorted(Path('.handoff-v06').glob('*.json')):
              for name, change in json.loads(batch.read_text()).items():
                  path=Path(name)
                  assert not path.is_absolute() and '..' not in path.parts
                  old=path.read_bytes() if path.exists() else None
                  assert (blob(old) if old is not None else None)==change['before'], 'base mismatch: '+name
                  if 'text' in change:
                      text=change['text']
                  else:
                      text=old.decode('utf-8')
                      for a,b,replacement in reversed(change['edits']):
                          text=text[:a]+replacement+text[b:]
                  if text is None:
                      path.unlink()
                  else:
                      data=text.encode('utf-8')
                      assert blob(data)==change['after'], 'result mismatch: '+name
                      path.parent.mkdir(parents=True,exist_ok=True)
                      path.write_bytes(data)
          PY
          git rm -r .handoff-v06 .github/workflows/apply-v06.yml
          git add -A
          test "$(git write-tree)" = 2ee485bc3d2ee082113659e03f6b38cf21495327
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: matte dragon, ear-axis bow, wide sea and single-pass crystal rim'
          git push origin HEAD:feat/v06-matte-sea-performance
