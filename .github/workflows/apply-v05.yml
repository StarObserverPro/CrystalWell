name: Apply verified v0.5
on:
  push:
    branches: [feat/v05-dragon-sea-optics]
    paths: [.github/workflows/apply-v05.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply checksum-verified local test tree
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma
          encoded = ''.join(Path(f'scripts/v05-patch.{i}.b64').read_text().strip() for i in range(4))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          expected = 'b9907babfbdbf984405330dbc9290c8dadfb130796cfdd31574e2ea616a0bb3b'
          assert hashlib.sha256(patch).hexdigest() == expected, 'Patch checksum mismatch'
          Path('/tmp/v05.patch').write_bytes(patch)
          PY
          git apply --check /tmp/v05.patch
          git apply --index /tmp/v05.patch
          git rm .github/workflows/renderer-kit.yml .github/workflows/apply-v05.yml scripts/v05-patch.*.b64
          test "$(git write-tree)" = "1df112c3c4de3b1a2dc03e90b36f32a3525bce23"
          npm run check
          npm test
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: fitted articulated dragon, magical sea and bounded crystal refraction'
          git push origin "HEAD:${GITHUB_REF_NAME}"
