name: Vendor licensed dragon
on:
  push:
    branches: [feat/v04-crystal-art-rebuild]
    paths: [scripts/vendor-dragon.py, .github/workflows/vendor-dragon.yml]
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v04-crystal-art-rebuild
      - run: python scripts/vendor-dragon.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false three@0.187.0
      - name: Bundle inspected source and renderer dependencies
        run: |
          mkdir -p artifacts/vendor
          cp -r assets artifacts/vendor/
          cp -r node_modules/three artifacts/vendor/three
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/dragon
          if ! git diff --cached --quiet; then
            git commit -m 'assets: vendor CC0 Grab3D Chinese Dragon with provenance'
            git push origin HEAD:feat/v04-crystal-art-rebuild
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: licensed-dragon-source
          path: artifacts/vendor/
          retention-days: 7
