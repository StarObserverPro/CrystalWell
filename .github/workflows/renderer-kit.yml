name: Renderer diagnostics kit
on:
  push:
    branches: [feat/v05-dragon-sea-optics]
    paths: [.github/workflows/renderer-kit.yml]
permissions:
  contents: read
jobs:
  kit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --no-save --package-lock=false three@0.187.0 @playwright/test@1.56.1
          npx playwright install chromium
          mkdir -p kit
          cp -r node_modules/three kit/three
          cp -r node_modules/playwright node_modules/playwright-core node_modules/@playwright kit/
          tar -C "$HOME/.cache/ms-playwright" -czf kit/chromium-runtime.tar.gz chromium_headless_shell-1194
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-renderer-kit
          path: kit/
          retention-days: 1
