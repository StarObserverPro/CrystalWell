name: Checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm test
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false three@0.187.0 @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-smoke
          path: artifacts/
          retention-days: 7
