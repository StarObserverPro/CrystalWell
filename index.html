<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#091324" />
  <title>水晶之井 · Crystal Well</title>
  <meta name="description" content="Release the crystal dragon sealed inside a magical well." />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="stylesheet" href="./src/styles.css" />
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"}}</script>
</head>
<body>
  <div id="app" aria-label="水晶之井，三维打砖块游戏">
    <section id="main-panel" aria-label="俯视井口，移动鼠标或拖动控制圆盾，点按或空格发射，Escape暂停"></section>
    <aside id="side-panel" aria-label="低帧率侧视图"></aside>
    <!-- Accessible hit areas only. All visible buttons, numbers and indicators are actual 3D meshes. -->
    <button id="pause" class="hit-target" aria-label="暂停或继续" title="Esc"></button>
    <button id="sound" class="hit-target" aria-label="关闭声音"></button>
    <button id="restart" class="hit-target" aria-label="重新开始"></button>
    <button id="center-action" class="hit-target" aria-label="继续" hidden></button>
    <output id="fps-readout" class="sr-only" aria-label="实测渲染帧率">0 FPS</output>
    <output id="game-status" class="sr-only" aria-live="polite"></output>
    <div class="portrait-gate sr-only" aria-live="polite">请横屏游玩</div>
    <div id="error-panel" hidden></div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
